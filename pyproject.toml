[project]
name = "resumidor-web"
version = "0.1.0"
description = "Plataforma web del resumidor de artículos científicos — Grupo 2"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # La canalización EVALUADA, no una reimplementación (ADR-005 §5).
    #
    # La URL de git es la verdad publicable: es lo que usan el contenedor y
    # CI. En desarrollo local, [tool.uv.sources] la sustituye por la carpeta
    # hermana para trabajar contra el código real sin reinstalar en cada
    # cambio. `uv ... --no-sources` ignora esa sustitución.
    "resumidor @ git+https://github.com/carlosforeroudea/ps1-g2.git",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",      # cliente de prueba de FastAPI
    "ruff>=0.5",
]

[tool.uv.sources]
# En local el paquete se toma del repositorio hermano, para desarrollar
# contra el código real sin publicarlo ni reinstalarlo en cada cambio.
resumidor = { path = "../repo", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `resumidor` se declara por URL de git. hatchling exige este permiso
# explícito para referencias directas, que es razonable: impide publicar en
# PyPI un paquete que dependa de una URL arbitraria. Aquí nunca se publica.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "modelo: descarga pesos y genera; se excluye en CI",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF"]
ignore = [
    # El proyecto se documenta en español con tipografía real.
    "RUF001", "RUF002", "RUF003",
]
